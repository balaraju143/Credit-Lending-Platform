<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 | Stackly Credit & Lending</title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- 404 CSS -->

    <link
        rel="stylesheet"
        href="css/404.css"
    >

</head>


<body>

    <!-- =====================================================
         STACKLY 404 PAGE
    ====================================================== -->

    <main class="stackly-404-page">


        <!-- Background Decoration -->

        <span class="error-bg-circle error-circle-one"></span>

        <span class="error-bg-circle error-circle-two"></span>

        <span class="error-bg-dot error-dot-one"></span>

        <span class="error-bg-dot error-dot-two"></span>


        <!-- =================================================
             ERROR CARD
        ================================================= -->

        <section class="stackly-404-card">


            <!-- Logo -->

            <a
                href="#"
                class="stackly-404-logo"
                aria-label="Stackly Home"
            >

                <img
                    src="assets/red-logo.webp"
                    alt="Stackly Credit & Lending"
                >

            </a>


            <!-- =================================================
                 404 VISUAL
            ================================================= -->

            <div class="stackly-404-visual">

                <span class="error-number">
                    4
                </span>


                <div class="error-icon">

                    <i class="fa-solid fa-file-invoice-dollar"></i>

                </div>


                <span class="error-number">
                    4
                </span>

            </div>


            <!-- =================================================
                 CONTENT
            ================================================= -->

            <div class="stackly-404-content">

                <span class="stackly-404-label">
                    CREDIT & LENDING
                </span>


                <h1>
                    Page Not Found
                </h1>


                <p>
                    The financial page you're looking for may have
                    moved, expired, or is no longer available.
                    Let's get you back to the Stackly lending hub.
                </p>

            </div>


            <!-- =================================================
                 BUTTONS
            ================================================= -->

            <div class="stackly-404-buttons">


                <!-- Home -->

                <a
                    href="index.html"
                    class="error-home-btn"
                >

    

                    <span>
                        Back to Home
                    </span>

                </a>


                <!-- Previous -->

                <button
                    type="button"
                    class="error-back-btn"
                    id="errorBackButton"
                >

                    <span>
                        Back to Previous Page
                    </span>

                    

                </button>

            </div>


        </section>

    </main>


    <!-- 404 JS -->

    <script src="js/404.js"></script>

</body>

</html>
